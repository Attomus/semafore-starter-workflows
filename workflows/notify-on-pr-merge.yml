name: SemaFore - Notify on Pull Request Merge

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions: {}

jobs:
  notify:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: Attomus/semafore-github-action@v1
        with:
          token: ${{ secrets.SEMAFORE_TOKEN }}
          device_key: ${{ secrets.SEMAFORE_DEVICE_KEY }}
          mode: notify
          target: org
          template: >-
            PR #${{ github.event.pull_request.number }} merged:
            ${{ github.event.pull_request.title }} by
            ${{ github.event.pull_request.user.login }}
